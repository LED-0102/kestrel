apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "kestrel.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{ include "kestrel.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {{ include "kestrel.selectorLabels" . | nindent 6 }}
  serviceName: {{ include "kestrel.fullname" . }}
  replicas: {{ .Values.replicas }}
  template:
    metadata:
      name: {{ include "kestrel.fullname" . }}
      labels: {{ include "kestrel.labels" . | nindent 8 }}
    spec:
      # initContainers...
      initContainers:
      - name: {{ include "kestrel.fullname" . }}-config-init
        image: busybox
        imagePullPolicy: IfNotPresent
        command:          
          - /bin/sh
          - -c
          - |-
            rm -r /var/run/kestrel/data
            mkdir -p /var/run/kestrel/data
            ID=$(echo $HOSTNAME | rev | cut -d- -f1 | rev)
            cat > /var/run/kestrel/config.yaml <<EOD
            data-dir: /var/run/kestrel/data
            rpc-port: {{.Values.rpcPort}}
            bind-addr: "$HOSTNAME.kestrel.{{.Release.Namespace}}.svc.cluster.local:{{.Values.serfPort}}"
            $([ $ID != 0 ] && echo 'start-join-addrs: "kestrel-0.kestrel.{{.Release.Namespace}}.svc.cluster.local:{{.Values.serfPort}}"')
            bootstrap: $([ $ID = 0 ] && echo true || echo false)
            EOD
        volumeMounts:
        - name: datadir
          mountPath: /var/run/kestrel
      # containers...
      containers:
      - name: {{ include "kestrel.fullname" . }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        ports:
        - containerPort: {{ .Values.rpcPort }}
          name: rpc
        - containerPort: {{ .Values.serfPort }}
          name: serf
        args:
          - --config-file=/var/run/kestrel/config.yaml
        # probes...
        #readinessProbe:
        #  exec:
        #    command: ["/bin/grpc_health_probe", "-addr=:{{ .Values.rpcPort }}"]
        #  initialDelaySeconds: 10
        #livenessProbe:
        #  exec:
        #    command: ["/bin/grpc_health_probe", "-addr=:{{ .Values.rpcPort }}"]
        #  initialDelaySeconds: 10
        # # probes...
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - |-
              /bin/grpc_health_probe -addr=$HOSTNAME.kestrel.{{.Release.Namespace}}.svc.cluster.local:{{.Values.rpcPort}}
          initialDelaySeconds: 10
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - |-
              /bin/grpc_health_probe -addr=$HOSTNAME.kestrel.{{.Release.Namespace}}.svc.cluster.local:{{.Values.rpcPort}}
          initialDelaySeconds: 10
        volumeMounts:
        - name: datadir
          mountPath: /var/run/kestrel
  volumeClaimTemplates:
  - metadata:
      name: datadir
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: {{ .Values.storage }}